services:
  web:
    build: .
    ports:
      - "811:80"
    command: "uvicorn app.main:app --host 0.0.0.0 --port 80 --reload"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5431:5432"  # 5431 - это внешний порт моего компьюетра на который пробрасывается порт 5432 из контейнера (внутренний)
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: