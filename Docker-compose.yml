services:
  web:
    build: .
    ports:
      - "80:80"
    command: "uvicorn app.main:app --host 0.0.0.0 --port 80 --reload"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
